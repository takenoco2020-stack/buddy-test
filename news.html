<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>組織・人事ニュースまとめ</title>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif;
    margin: 0;
    background: #fafbfc;
    color: #222;
    line-height: 1.7;
  }
  header {
    background: linear-gradient(120deg, #0b63f6, #5c8cff);
    color: white;
    padding: 3rem 2rem;
    text-align: center;
  }
  header h1 {
    font-size: 2.2rem;
    margin: 0 0 0.5rem;
  }
  header p {
    font-size: 1rem;
    opacity: 0.9;
    margin: 0.3rem 0;
  }
  main {
    max-width: 960px;
    margin: 0 auto;
    padding: 2rem 1.5rem 4rem;
  }
  .tabs {
    display: flex;
    gap: 0.5rem;
    margin-bottom: 1.5rem;
    position: sticky;
    top: 0;
    background: #fafbfc;
    padding: 1rem 0;
    z-index: 10;
  }
  .tab {
    flex: 1;
    text-align: center;
    padding: 0.8rem 1rem;
    border-radius: 10px;
    background: white;
    border: 2px solid #dde3f0;
    cursor: pointer;
    font-weight: bold;
    font-size: 1.05rem;
    color: #444;
  }
  .tab.active {
    background: #0b63f6;
    border-color: #0b63f6;
    color: white;
  }
  .region {
    display: none;
  }
  .region.active {
    display: block;
  }
  .category {
    background: white;
    border-radius: 12px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.06);
    padding: 1.5rem 1.5rem;
    margin-bottom: 1.5rem;
  }
  .category h2 {
    font-size: 1.25rem;
    border-left: 6px solid #5c8cff;
    padding-left: 0.6rem;
    margin: 0 0 1rem;
    color: #0b1c4a;
  }
  ul.articles {
    list-style: none;
    margin: 0;
    padding: 0;
  }
  ul.articles li {
    padding: 0.8rem 0;
    border-bottom: 1px solid #eef1f6;
  }
  ul.articles li:last-child {
    border-bottom: none;
  }
  .articles a {
    color: #0b1c4a;
    text-decoration: none;
    font-weight: 600;
  }
  .articles a:hover {
    text-decoration: underline;
    color: #0b63f6;
  }
  .meta {
    display: block;
    font-size: 0.85rem;
    color: #777;
    margin-top: 0.2rem;
  }
  .empty {
    color: #888;
    font-size: 0.95rem;
    padding: 0.5rem 0;
  }
  .status {
    text-align: center;
    color: #666;
    font-size: 0.9rem;
    margin-bottom: 1rem;
  }
  footer {
    text-align: center;
    padding: 2rem;
    font-size: 0.85rem;
    color: #888;
  }
  @media (max-width: 640px) {
    header h1 { font-size: 1.6rem; }
  }
</style>
</head>
<body>
<header>
  <h1>組織・人事ニュースまとめ</h1>
  <p id="target-date">読み込み中...</p>
</header>

<main>
  <div class="tabs">
    <div class="tab active" data-region="nationwide">全国</div>
    <div class="tab" data-region="shizuoka">静岡</div>
  </div>

  <p class="status" id="status"></p>

  <div id="regions"></div>
</main>

<footer>
  <p>Googleニュース検索RSSをもとに毎日自動収集しています。</p>
</footer>

<script>
async function loadNews() {
  const statusEl = document.getElementById("status");
  const dateEl = document.getElementById("target-date");
  const regionsEl = document.getElementById("regions");

  let data;
  try {
    const res = await fetch("data/news.json", { cache: "no-store" });
    data = await res.json();
  } catch (e) {
    statusEl.textContent = "ニュースデータの読み込みに失敗しました。";
    return;
  }

  if (!data.generatedAt) {
    dateEl.textContent = "まだニュースが収集されていません";
    statusEl.textContent = "初回の自動収集をお待ちください。";
  } else {
    dateEl.textContent = `${data.targetDate} の組織・人事ニュース`;
    const generated = new Date(data.generatedAt);
    statusEl.textContent = `最終更新: ${generated.toLocaleString("ja-JP", { timeZone: "Asia/Tokyo" })}`;
  }

  for (const [regionKey, region] of Object.entries(data.regions)) {
    const section = document.createElement("section");
    section.className = "region";
    section.dataset.region = regionKey;
    if (regionKey === "nationwide") section.classList.add("active");

    if (!region.categories || region.categories.length === 0) {
      const empty = document.createElement("p");
      empty.className = "empty";
      empty.textContent = "この地域のニュースはまだありません。";
      section.appendChild(empty);
    }

    for (const category of region.categories || []) {
      const catDiv = document.createElement("div");
      catDiv.className = "category";

      const h2 = document.createElement("h2");
      h2.textContent = category.label;
      catDiv.appendChild(h2);

      if (!category.items || category.items.length === 0) {
        const empty = document.createElement("p");
        empty.className = "empty";
        empty.textContent = "本日該当するニュースはありません。";
        catDiv.appendChild(empty);
      } else {
        const ul = document.createElement("ul");
        ul.className = "articles";
        for (const item of category.items) {
          const li = document.createElement("li");
          const a = document.createElement("a");
          a.href = item.link;
          a.target = "_blank";
          a.rel = "noopener";
          a.textContent = item.title;
          li.appendChild(a);

          const meta = document.createElement("span");
          meta.className = "meta";
          const pub = item.pubDate ? new Date(item.pubDate).toLocaleString("ja-JP", { timeZone: "Asia/Tokyo" }) : "";
          meta.textContent = [item.source, pub].filter(Boolean).join(" ・ ");
          li.appendChild(meta);

          ul.appendChild(li);
        }
        catDiv.appendChild(ul);
      }

      section.appendChild(catDiv);
    }

    regionsEl.appendChild(section);
  }
}

document.querySelectorAll(".tab").forEach((tab) => {
  tab.addEventListener("click", () => {
    document.querySelectorAll(".tab").forEach((t) => t.classList.remove("active"));
    document.querySelectorAll(".region").forEach((r) => r.classList.remove("active"));
    tab.classList.add("active");
    document.querySelector(`.region[data-region="${tab.dataset.region}"]`).classList.add("active");
  });
});

loadNews();
</script>
</body>
</html>
